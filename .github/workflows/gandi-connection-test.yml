name: Vérification connexion Gandi (lecture seule)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sftp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Préparer une clé SSH temporaire
        env:
          GANDI_SSH_PRIVATE_KEY: ${{ secrets.GANDI_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$GANDI_SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$GANDI_SSH_PRIVATE_KEY" > ~/.ssh/jalauris_deploy
          chmod 600 ~/.ssh/jalauris_deploy

      - name: Vérifier l'identité SSH publiée par Gandi
        env:
          SFTP_HOST: ${{ vars.GANDI_SFTP_HOST }}
        run: |
          set -eu
          test -n "$SFTP_HOST"
          ssh-keyscan -T 10 -t ed25519 "$SFTP_HOST" > ~/.ssh/known_hosts
          fingerprint="$(ssh-keygen -lf ~/.ssh/known_hosts -E md5)"
          printf '%s\n' "$fingerprint" | grep -F 'MD5:5a:f5:68:71:4b:86:b4:96:61:1c:5f:d9:b1:21:4f:31'
          chmod 600 ~/.ssh/known_hosts

      - name: Tester la lecture du dossier web sans rien modifier
        env:
          SFTP_HOST: ${{ vars.GANDI_SFTP_HOST }}
          SFTP_USER: ${{ vars.GANDI_SFTP_USER }}
          SFTP_PATH: ${{ vars.GANDI_DEPLOY_PATH }}
        run: |
          set -eu
          test -n "$SFTP_HOST"
          test -n "$SFTP_USER"
          test -n "$SFTP_PATH"
          printf 'ls -la %s\n' "$SFTP_PATH" | sftp -b - -i ~/.ssh/jalauris_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$SFTP_USER@$SFTP_HOST"
